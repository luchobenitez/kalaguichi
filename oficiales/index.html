<!doctype html>
<html lang="es" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Kalaguichi.com: resultados del cómputo oficial de las elecciones, cuando se publiquen.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <link rel="icon" href="../assets/img/kalaguichi-isotipo.svg" type="image/svg+xml">
    <meta name="color-scheme" content="light dark">
    <title>Kalaguichi.com · Resultados oficiales · Municipales 2026 en Asunción</title>
    <link rel="stylesheet" href="../assets/css/shell.css">
    <link rel="stylesheet" href="../assets/css/resultados.css">
    <link rel="stylesheet" href="../assets/css/tablero.css">
    <script type="module" src="../assets/js/sitio.js"></script>
    <script type="module" src="../assets/js/shell.js"></script>
    <script type="module" src="../assets/js/tablero/inicio.js"></script>
</head>

<body>
<noscript>El tablero necesita JavaScript para leer las actas por mesa.</noscript>
<div class="app-shell">
    <div class="background-grid" aria-hidden="true"></div>
    <div class="ambient-glow ambient-glow--orange" aria-hidden="true"></div>
    <div class="ambient-glow ambient-glow--blue" aria-hidden="true"></div>

    <header class="site-header">
        <div class="site-header__inner">
            <a href="../" class="brand">
                <span class="brand__mark">
                    <img src="../assets/img/kalaguichi-isotipo.svg" alt="">
                </span>

                <span class="brand__text">
                    <strong>Kalaguichi.com</strong>
                    <small>Resultados oficiales</small>
                </span>
            </a>

            <nav class="site-nav" aria-label="Secciones del sitio">
                <a href="../padron/" data-seccion="padron"><svg class="site-nav__icono" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="11" r="2"></circle><path d="M6 16c.8-1.4 1.8-2 3-2s2.2.6 3 2M14 10h4M14 14h4"></path></svg><span class="site-nav__texto">Padrón electoral</span><span class="site-nav__corto" aria-hidden="true">Padrón</span></a>
                <a href="../trep/" data-seccion="trep"><svg class="site-nav__icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16"></path><path d="M7 16v-5M12 16V6M17 16V8"></path></svg><span class="site-nav__texto">TREP</span><span class="site-nav__corto" aria-hidden="true">TREP</span></a>
                <a href="../oficiales/" data-seccion="oficiales" aria-current="page"><svg class="site-nav__icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 12l2 2 4-4"></path><path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6l7-3Z"></path></svg><span class="site-nav__texto">Resultados oficiales</span><span class="site-nav__corto" aria-hidden="true">Oficiales</span></a>
                <a href="../analisis/" data-seccion="analisis"><svg class="site-nav__icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5M4 19h16"></path><path d="M7 15l4-5 3 3 5-6"></path></svg><span class="site-nav__texto">Análisis</span><span class="site-nav__corto" aria-hidden="true">Análisis</span></a>
                <a href="../acerca/" data-seccion="acerca"><svg class="site-nav__icono" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg><span class="site-nav__texto">Acerca de</span><span class="site-nav__corto" aria-hidden="true">Acerca</span></a>
            </nav>

            <div class="site-header__acciones">
                <button id="compartir" type="button" class="theme-toggle" aria-label="Compartir esta página" title="Compartir esta página">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                        <circle cx="18" cy="5" r="2.5"></circle><circle cx="6" cy="12" r="2.5"></circle><circle cx="18" cy="19" r="2.5"></circle>
                        <path stroke-linecap="round" d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"></path>
                    </svg>
                </button>
                <button
                    id="themeToggle"
                    type="button"
                    class="theme-toggle"
                    aria-label="Cambiar modo de visualización"
                    title="Cambiar modo de visualización"
                >
                    <svg id="sunIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                        <circle cx="12" cy="12" r="4"></circle>
                        <path stroke-linecap="round" d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
                    </svg>

                    <svg id="moonIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path>
                    </svg>
                </button>
            </div>
        </div>
    </header>
    <div class="barra-contexto" id="barraContexto" data-fuente="oficial">
        <div class="barra-contexto__inner">
            <nav class="barra-contexto__ruta" aria-label="Elección y año">
                <span class="barra-contexto__paso" data-contexto="eleccion">Municipales</span>
                <span class="barra-contexto__paso" data-contexto="anio">2026</span>
            </nav>
            <div class="selector-cargo" role="tablist" aria-label="Cargo" id="selectorCargo"></div>
            <p class="barra-contexto__fuente" id="estadoFuente" aria-live="polite"></p>
        </div>
    </div>
    <p class="aviso-fuente" id="avisoFuente" hidden></p>

    <main id="visor" aria-busy="true" data-fuente="oficial"></main>

    <footer class="site-footer">
        <p>© <span id="currentYear"></span> Kalaguichi.com · Iniciativa independiente, no vinculada al TSJE.</p>
        <p><a href="../padron/privacidad.html">Privacidad y límites de la consulta del padrón</a></p>
    </footer>
</div>
<!-- Plantilla del tablero: copia de la de trep/index.html (tools/sincronizar_tablero.py). -->

<template id="plantillaTablero">
        <h1 class="visualmente-oculto" id="tituloTablero">Resultados · Municipales 2026 · Asunción</h1>
        <p class="error-carga" id="errorCarga" role="alert" hidden></p>

        <aside class="tablero__filtros" id="filtros" aria-labelledby="tituloFiltros">
            <div class="filtros__cabecera">
                <h2 id="tituloFiltros">Filtros y capas</h2>
                <button type="button" class="boton-secundario filtros__cerrar" id="cerrarFiltros">Listo</button>
            </div>
            <nav class="ruta-geo" aria-label="Ruta geográfica">
                <ol id="rutaGeo"></ol>
            </nav>
            <div class="filtros__niveles">
                <label class="campo-select" for="nivelZona">
                    Zona
                    <select id="nivelZona">
                        <option value="">Toda Asunción</option>
                        <optgroup label="Zonas municipales (oficiales)" id="opcionesMunicipales"></optgroup>
                        <optgroup label="Zonas electorales (TSJE)" id="opcionesTsje"></optgroup>
                    </select>
                </label>
                <label class="campo-select" for="nivelBarrio">
                    Barrio
                    <select id="nivelBarrio"></select>
                </label>
                <label class="campo-select" for="nivelLocal">
                    Local
                    <select id="nivelLocal"></select>
                </label>
                <label class="campo-select" for="nivelMesa">
                    Mesa
                    <select id="nivelMesa"></select>
                </label>
            </div>
            <div class="buscar-local">
                <label class="campo-buscar" for="buscarLocal">
                    <span>Buscar local</span>
                    <input type="search" id="buscarLocal" placeholder="Nombre, dirección o barrio" autocomplete="off" role="combobox"
                           aria-autocomplete="list" aria-expanded="false" aria-controls="sugerenciasLocal">
                </label>
                <ul class="sugerencias" id="sugerenciasLocal" role="listbox" aria-label="Locales encontrados" hidden></ul>
                <p class="visualmente-oculto" id="estadoBusqueda" role="status" aria-live="polite"></p>
            </div>
            <fieldset class="capas" id="capas">
                <legend>Capa del mapa</legend>
                <label class="capas__opcion"><input type="radio" name="capa" value="lista"><span>Lista más votada</span></label>
                <label class="capas__opcion"><input type="radio" name="capa" value="listas"><span>Votos por lista</span></label>
                <div class="capas__detalle" id="detalleListas" hidden>
                    <label class="campo-select" for="capaLista">
                        Lista
                        <select id="capaLista"></select>
                    </label>
                    <div class="segmentos" role="group" aria-label="Medida">
                        <button type="button" data-medida="pct" aria-pressed="true">Porcentaje</button>
                        <button type="button" data-medida="votos" aria-pressed="false">Votos</button>
                    </div>
                </div>
                <label class="capas__opcion"><input type="radio" name="capa" value="participacion"><span>Participación</span></label>
                <label class="capas__opcion"><input type="radio" name="capa" value="margen"><span>Margen ANR − AJA</span></label>
                <label class="capas__opcion"><input type="radio" name="capa" value="ipm"><span>Pobreza multidimensional (IPM)</span></label>
                <div class="capas__detalle" id="detalleIpm" hidden>
                    <div class="segmentos" role="group" aria-label="Componente del IPM">
                        <button type="button" data-ipm="H" aria-pressed="true">Incidencia</button>
                        <button type="button" data-ipm="A" aria-pressed="false">Intensidad</button>
                        <button type="button" data-ipm="IPM" aria-pressed="false">IPM</button>
                    </div>
                </div>
                <label class="capas__opcion"><input type="radio" name="capa" value="zona"><span>Zona TSJE</span></label>
            </fieldset>
            <p class="nota" id="notaCapa"></p>
            <div class="filtros__pie">
                <button type="button" class="boton-secundario" id="abrirFuentes" aria-haspopup="dialog" aria-controls="dialogoFuentes"><svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg>Fuentes y método</button>
                <a class="boton-secundario" id="enlaceInforme" href="#modo=informe">Vista informe</a>
            </div>
            <p class="tablero__legal" id="avisoLegal">Iniciativa independiente, no vinculada al TSJE.</p>
        </aside>

        <section class="tablero__mapa" aria-labelledby="tituloMapa">
            <h2 class="visualmente-oculto" id="tituloMapa">Mapa de Asunción</h2>
            <div class="mapa mapa--gestos" id="mapa"></div>
            <details class="mapa__leyenda mapa__leyenda--fija" id="leyendaMapa" open>
                <summary id="tituloLeyenda">Leyenda</summary>
                <ul class="leyenda" id="leyenda"></ul>
            </details>
            <button type="button" class="tablero__capas" id="botonCapas" aria-controls="filtros" aria-expanded="false"><svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5 9-5Z"></path><path d="M3 13l9 5 9-5"></path></svg><span>Capas</span></button>
        </section>

        <div class="tablero__hoja" id="hoja" data-altura="peek" data-panel="resultados">
            <button type="button" class="hoja__asa" id="asaHoja" aria-controls="hoja" aria-label="Agrandar el panel">
                <span class="hoja__agarre" aria-hidden="true"></span>
            </button>
            <div class="bandeja__separador" id="separador" role="separator" aria-orientation="horizontal" aria-label="Alto de la bandeja de tablas"
                 aria-controls="panelTabla panelRanking" tabindex="0"></div>
            <section class="tablero__indicadores" aria-label="Indicadores de la selección">
                <dl class="indicadores" id="indicadores"></dl>
            </section>
            <div class="tablero__pestanas pestanas" role="tablist" aria-label="Paneles del tablero" id="pestanasTablero">
                <button type="button" role="tab" id="pestana-resultados" data-panel="resultados" aria-controls="panelResultados" aria-selected="true">Resultados</button>
                <button type="button" role="tab" id="pestana-tabla" data-panel="tabla" aria-controls="panelTabla" aria-selected="false" tabindex="-1">Tabla</button>
                <button type="button" role="tab" id="pestana-ranking" data-panel="ranking" aria-controls="panelRanking" aria-selected="false" tabindex="-1">Ranking</button>
            </div>
            <section class="tablero__resultados" id="panelResultados" aria-labelledby="tituloTotales">
                <article class="panel panel--totales" id="panelTotales">
                    <div class="panel--totales__cabecera">
                        <div>
                            <p class="panel__eyebrow" id="eyebrowTotales">Resultado</p>
                            <h2 id="tituloTotales">Asunción</h2>
                            <p class="panel__meta" id="metaTotales"></p>
                        </div>
                        <div class="panel__acciones">
                            <button type="button" class="boton-secundario" id="limpiarSeleccion" hidden>Ver toda Asunción</button>
                        </div>
                    </div>
                    <div class="panel--totales__cuerpo">
                        <div class="lista-resultados" id="listaResultados" aria-live="polite"></div>
                        <div class="panel--totales__lateral">
                            <div class="participacion" id="participacion"></div>
                            <div class="diferencia" id="diferencia"></div>
                            <dl class="otros-votos" id="otrosVotos"></dl>
                        </div>
                    </div>
                </article>
                <article class="panel panel--bancas" id="panelBancas" aria-labelledby="tituloBancas" hidden>
                    <div class="panel__barra">
                        <div>
                            <p class="panel__eyebrow">Junta Municipal · D'Hondt</p>
                            <h2 id="tituloBancas">Bancas de la Junta Municipal</h2>
                            <p class="panel__meta" id="metaBancas"></p>
                        </div>
                    </div>
                    <ul class="bancas__leyenda" id="bancasLeyenda"></ul>
                    <div class="bancas" id="bancas"></div>
                    <div class="bancas__personas" id="bancasPersonas"></div>
                    <p class="nota" id="notaBancas"></p>
                </article>
            </section>
            <section class="tablero__tabla" id="panelTabla" role="tabpanel" aria-labelledby="pestana-tabla" hidden>
                <div class="panel__barra bandeja__controles">
                    <label class="campo-select" for="unidadTabla">
                        Ver por
                        <select id="unidadTabla">
                            <option value="mesa">Mesa</option>
                            <option value="local" selected>Local</option>
                            <option value="barrio">Barrio</option>
                            <option value="zona">Zona TSJE</option>
                            <option value="zona_municipal">Zona municipal</option>
                        </select>
                    </label>
                    <label class="campo-buscar" for="filtroTabla">
                        <span>Filtrar</span>
                        <input type="search" id="filtroTabla" placeholder="Nombre de local o barrio" autocomplete="off">
                    </label>
                </div>
                <div class="tabla-scroll" id="desplazaTabla">
                    <table class="tabla" id="tabla">
                        <thead></thead>
                        <tbody></tbody>
                    </table>
                </div>
                <p class="nota" id="notaTabla"></p>
            </section>
            <section class="tablero__ranking" id="panelRanking" role="tabpanel" aria-labelledby="pestana-ranking" hidden>
                <div class="panel__barra bandeja__controles">
                    <div class="segmentos" role="group" aria-label="Unidad del ranking">
                        <button type="button" data-ranking="local" aria-pressed="true">Locales</button>
                        <button type="button" data-ranking="barrio" aria-pressed="false">Barrios</button>
                    </div>
                    <div class="segmentos" role="group" aria-label="Orden del ranking">
                        <button type="button" data-orden-ranking="desc" aria-pressed="true">Mayor a menor</button>
                        <button type="button" data-orden-ranking="asc" aria-pressed="false">Menor a mayor</button>
                    </div>
                </div>
                <p class="ranking__titulo" id="tituloRanking"></p>
                <ol class="ranking-lista" id="ranking"></ol>
                <p class="nota" id="notaRanking"></p>
            </section>
        </div>

        <dialog class="dialogo" id="dialogoFuentes" aria-labelledby="tituloFuentes">
            <div class="dialogo__cabecera">
                <h2 id="tituloFuentes">Fuentes y método</h2>
                <button type="button" class="boton-secundario" id="cerrarFuentes">Cerrar</button>
            </div>
            <div class="fuentes" id="fuentes"></div>
            <section class="info-grid" aria-label="Vistas no disponibles" id="noDisponible"></section>
        </dialog>
</template>
</body>
</html>
